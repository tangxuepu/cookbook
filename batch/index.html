<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导入 21 道菜</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
// 读 URL 参数 ?n=1 取 batch1.txt，转成同步链接后自动跳转
(async () => {
  const params = new URLSearchParams(location.search);
  const n = params.get('n') || '1';
  try {
    const r = await fetch('./batch' + n + '.txt');
    const url = (await r.text()).trim();
    // 把 #d=xxx 改成 #sync=1&d=xxx 让做饭助手走自动同步路径
    location.replace(url);
  } catch (e) {
    document.body.innerText = '加载失败：' + e.message;
  }
})();
</script>
</head>
<body style="font-family:sans-serif;padding:20px">正在跳转...</body>
</html>
