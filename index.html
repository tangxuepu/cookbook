<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f97316">
  <title>做饭助手</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
  <style>
    :root {
      --orange: #f97316;
      --orange-light: #fed7aa;
      --orange-dark: #c2410c;
      --bg: #fff7ed;
      --card: #ffffff;
      --text: #1c1917;
      --text-secondary: #78716c;
      --border: #e7e5e4;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: 80px;
    }

    /* Header */
    header {
      background: var(--orange);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(249,115,22,0.3);
    }
    header h1 { font-size: 20px; font-weight: 600; }
    .header-actions { display: flex; gap: 12px; }
    .header-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* Search */
    .search-bar {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid var(--border);
    }
    .search-bar input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: var(--orange); }

    /* Recipe List */
    .recipe-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .recipe-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 1px solid var(--border);
    }
    .recipe-card:active { transform: scale(0.98); }
    .recipe-card-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .recipe-card-meta {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .recipe-card-tags {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--orange-light);
      color: var(--orange-dark);
    }
    .tag.no-image { background: #f1f5f9; color: #64748b; }
    .tag.empty { background: #f1f5f9; color: #94a3b8; }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; margin-bottom: 16px; }
    .empty-state button {
      background: var(--orange);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--orange);
      color: white;
      border: none;
      font-size: 28px;
      box-shadow: 0 4px 16px rgba(249,115,22,0.5);
      cursor: pointer;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      width: 100%;
      max-width: 600px;
      border-radius: 20px 20px 0 0;
      max-height: 92dvh;
      overflow-y: auto;
      padding: 24px 20px 32px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 { font-size: 18px; }
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
    }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: #fafaf9;
      outline: none;
      resize: none;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--orange); background: white; }
    .form-group textarea { min-height: 100px; }
    .form-group small { display: block; margin-top: 4px; font-size: 12px; color: var(--text-secondary); }

    .step-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--orange);
      color: white;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 8px;
    }
    .step-row textarea { flex: 1; min-height: 60px; }
    .step-del {
      background: #fee2e2;
      color: var(--danger);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      flex-shrink: 0;
    }
    .add-step-btn {
      background: none;
      border: 1.5px dashed var(--border);
      color: var(--text-secondary);
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 4px;
    }
    .add-step-btn:hover { border-color: var(--orange); color: var(--orange); }

    .btn-primary {
      width: 100%;
      background: var(--orange);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary {
      width: 100%;
      background: white;
      color: var(--text);
      border: 1.5px solid var(--border);
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Detail View */
    .detail-view {
      display: none;
      padding: 16px;
    }
    .detail-view.active { display: block; }
    .list-view.hidden { display: none; }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .detail-title { font-size: 24px; font-weight: 700; }
    .detail-actions { display: flex; gap: 8px; }
    .detail-section {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .detail-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .detail-source { font-size: 14px; }
    .detail-source a { color: var(--orange); word-break: break-all; }
    .detail-source img { max-width: 100%; border-radius: 8px; margin-top: 8px; }

    .step-item {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .step-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .step-item-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--orange-light);
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-item-text { font-size: 15px; line-height: 1.6; flex: 1; }

    .reflection-item {
      background: #fff7ed;
      border-left: 3px solid var(--orange);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    .reflection-date { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .pits-item {
      background: #fef2f2;
      border-left: 3px solid var(--danger);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 6px;
      font-size: 14px;
      line-height: 1.6;
    }
    .pits-item::before { content: "⚠️ "; }

    /* Reflection Form */
    .add-reflection {
      margin-top: 12px;
    }
    .toggle-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 8px 0;
    }
    .toggle-section h3 { font-size: 14px; color: var(--text-secondary); }
    .toggle-arrow { transition: transform 0.2s; font-size: 18px; color: var(--text-secondary); }
    .toggle-section.open .toggle-arrow { transform: rotate(180deg); }
    .toggle-content { display: none; }
    .toggle-content.open { display: block; }

    /* Import/Export */
    .data-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .data-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: white;
      color: var(--text);
    }
    #import-file { display: none; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1c1917;
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 500;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Back button */
    .back-btn {
      background: none;
      border: none;
      color: var(--orange);
      font-size: 28px;
      cursor: pointer;
      padding: 4px 8px 4px 0;
      line-height: 1;
    }
    .back-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Category tabs */
    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      background: white;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: white;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--orange);
      color: white;
      border-color: var(--orange);
    }

    .no-pits { color: var(--text-secondary); font-size: 14px; padding: 8px 0; }
    .no-reflections { color: var(--text-secondary); font-size: 14px; padding: 8px 0; }
  </style>
</head>
<body>

<!-- List View -->
<div class="list-view" id="listView">
  <header>
    <h1>🍳 做饭助手</h1>
    <div class="header-actions">
      <button class="header-btn" onclick="showDataModal()">📦 数据</button>
    </div>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索菜名…" oninput="renderList()">
  </div>

  <div class="category-tabs" id="categoryTabs"></div>

  <div id="recipeList" class="recipe-list"></div>

  <div id="emptyState" class="empty-state" style="display:none">
    <div class="emoji">🍳</div>
    <p>还没有菜谱<br>记录你做的第一道菜吧</p>
    <button onclick="showAddModal()">+ 添加菜谱</button>
  </div>

  <button class="fab" onclick="showAddModal()">+</button>
</div>

<!-- Detail View -->
<div class="detail-view" id="detailView">
  <div style="padding: 12px 16px 0;">
    <div class="back-header">
      <button class="back-btn" onclick="showList()">←</button>
      <span style="font-size:14px;color:var(--text-secondary);">返回</span>
    </div>
  </div>
  <div style="padding: 8px 16px 0;">
    <div class="detail-header">
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-actions">
        <button class="btn-danger" onclick="deleteRecipe()">删除</button>
      </div>
    </div>
  </div>

  <div style="padding: 0 16px;">
    <div class="detail-section" id="sourceSection" style="display:none">
      <div class="detail-section-title">📎 来源</div>
      <div class="detail-source" id="detailSource"></div>
    </div>

    <div class="detail-section" id="stepsSection">
      <div class="detail-section-title">📝 步骤</div>
      <div id="detailSteps"></div>
    </div>

    <div class="detail-section" id="pitsSection">
      <div class="detail-section-title">⚠️ 踩过的坑</div>
      <div id="detailPits"></div>
    </div>

    <div class="detail-section" id="reflectionSection">
      <div class="detail-section-title">💡 做后的反思</div>
      <div id="detailReflections"></div>
      <div class="add-reflection">
        <div class="toggle-section" onclick="toggleReflectionForm(this)">
          <h3>添加这次做的情况</h3>
          <span class="toggle-arrow">▼</span>
        </div>
        <div class="toggle-content">
          <div class="form-group" style="margin-top:10px">
            <label>这次做得怎么样？</label>
            <textarea id="newReflection" placeholder="这次糖色炒得不错，但火稍微大了一点点…" rows="2"></textarea>
          </div>
          <div class="form-group">
            <label>这次踩的坑（可不填）</label>
            <textarea id="newPit" placeholder="冰糖下锅时机太早…" rows="2"></textarea>
          </div>
          <button class="btn-primary" onclick="addReflection()" style="margin-top:8px">保存记录</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">添加菜谱</h2>
      <button class="modal-close" onclick="closeAddModal()">×</button>
    </div>
    <div class="form-group">
      <label>菜名 *</label>
      <input type="text" id="recipeName" placeholder="比如：红烧肉">
    </div>
    <div class="form-group">
      <label>分类</label>
      <select id="recipeCategory">
        <option value="">不分类</option>
        <option value="肉类">🥩 肉类</option>
        <option value="蔬菜">🥬 蔬菜</option>
        <option value="主食">🍚 主食</option>
        <option value="汤类">🍲 汤类</option>
        <option value="小吃">🍡 小吃</option>
        <option value="饮品">🧋 饮品</option>
        <option value="其他">📌 其他</option>
      </select>
    </div>
    <div class="form-group">
      <label>来源链接</label>
      <input type="text" id="recipeSource" placeholder="小红书链接或其他教程地址">
    </div>
    <div class="form-group">
      <label>步骤</label>
      <div id="stepsEditor"></div>
      <button class="add-step-btn" onclick="addStepField()">+ 添加步骤</button>
    </div>
    <div class="form-group">
      <label>注意的坑（可选）</label>
      <textarea id="recipePits" placeholder="每行一个坑，比如：糖色一定小火，不要炒糊"></textarea>
      <small>每行一个注意点</small>
    </div>
    <button class="btn-primary" id="saveBtn" onclick="saveRecipe()">保存菜谱</button>
    <button class="btn-secondary" onclick="closeAddModal()">取消</button>
  </div>
</div>

<!-- Data Modal -->
<div class="modal-overlay" id="dataModal">
  <div class="modal">
    <div class="modal-header">
      <h2>📦 数据管理</h2>
      <button class="modal-close" onclick="closeDataModal()">×</button>
    </div>
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;">
      共 <strong id="dataCount">0</strong> 条菜谱，最后更新 <strong id="dataDate">—</strong>
    </p>
    <div class="data-actions">
      <button onclick="exportData()">📤 导出数据</button>
      <button onclick="document.getElementById('import-file').click()">📥 导入数据</button>
      <input type="file" id="import-file" accept=".json" onchange="importData(event)">
    </div>
    <div style="margin-top:20px;padding:14px;background:#fff7ed;border-radius:12px;border:1px solid var(--orange-light);">
      <p style="font-size:13px;color:var(--text-secondary);line-height:1.6;">
        💡 <strong>提示：</strong>导出后妥善保存 json 文件，换手机时导入即可恢复所有菜谱。
      </p>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let recipes = [];
let currentId = null;
let editingId = null;
let currentCategory = '';

// ─── Init ─────────────────────────────────────────────────────────────────────
function init() {
  loadFromStorage();
  renderList();
  renderCategoryTabs();
  setupPWA();
}

function loadFromStorage() {
  const raw = localStorage.getItem('cookbook_recipes');
  if (raw) {
    try { recipes = JSON.parse(raw); } catch { recipes = []; }
  }
}

function saveToStorage() {
  localStorage.setItem('cookbook_recipes', JSON.stringify(recipes));
  const ts = document.getElementById('dataDate');
  if (ts) document.getElementById('dataDate').textContent = new Date().toLocaleDateString('zh-CN');
  const tc = document.getElementById('dataCount');
  if (tc) document.getElementById('dataCount').textContent = recipes.length;
}

// ─── PWA ──────────────────────────────────────────────────────────────────────
function setupPWA() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

// ─── List View ────────────────────────────────────────────────────────────────
function renderList() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = recipes;

  if (q) {
    filtered = filtered.filter(r =>
      r.name.toLowerCase().includes(q) ||
      (r.category && r.category.toLowerCase().includes(q))
    );
  }
  if (currentCategory) {
    filtered = filtered.filter(r => r.category === currentCategory);
  }

  filtered.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));

  const list = document.getElementById('recipeList');
  const empty = document.getElementById('emptyState');

  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('categoryTabs').style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  document.getElementById('categoryTabs').style.display = 'flex';

  list.innerHTML = filtered.map(r => {
    const lastReflection = (r.reflections && r.reflections.length > 0)
      ? r.reflections[r.reflections.length - 1].text.substring(0, 30)
      : '';
    const pitCount = r.pits && r.pits.length > 0 ? r.pits.length : 0;
    const stepCount = r.steps && r.steps.length > 0 ? r.steps.length : 0;
    const meta = [stepCount ? `📝 ${stepCount}步` : '', pitCount ? `⚠️ ${pitCount}坑` : ''].filter(Boolean).join(' · ');

    return `
      <div class="recipe-card" onclick="showDetail('${r.id}')">
        <div class="recipe-card-title">${escapeHtml(r.name)}</div>
        <div class="recipe-card-meta">${meta || '暂无步骤'}${lastReflection ? ' · ' + escapeHtml(lastReflection) + '…' : ''}</div>
        <div class="recipe-card-tags">
          ${r.category ? `<span class="tag">${escapeHtml(r.category)}</span>` : ''}
          ${pitCount > 0 ? `<span class="tag">⚠️ ${pitCount}个坑</span>` : ''}
          ${!stepCount ? '<span class="tag empty">待补充步骤</span>' : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderCategoryTabs() {
  const cats = [...new Set(recipes.map(r => r.category).filter(Boolean))];
  const container = document.getElementById('categoryTabs');
  container.innerHTML = `
    <button class="tab-btn ${!currentCategory ? 'active' : ''}" onclick="setCategory('')">全部</button>
    ${cats.map(c => `<button class="tab-btn ${currentCategory === c ? 'active' : ''}" onclick="setCategory('${escapeHtml(c)}')">${escapeHtml(c)}</button>`).join('')}
  `;
}

function setCategory(cat) {
  currentCategory = cat;
  renderCategoryTabs();
  renderList();
}

// ─── Detail View ─────────────────────────────────────────────────────────────
function showDetail(id) {
  currentId = id;
  const r = recipes.find(x => x.id === id);
  if (!r) return;

  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.add('active');
  document.getElementById('detailTitle').textContent = r.name;

  // Source
  const sourceSection = document.getElementById('sourceSection');
  if (r.source && r.source.trim()) {
    sourceSection.style.display = 'block';
    const sourceEl = document.getElementById('detailSource');
    if (r.source.match(/^https?:\/\//)) {
      sourceEl.innerHTML = `<a href="${escapeHtml(r.source)}" target="_blank" rel="noopener">${escapeHtml(r.source)}</a>`;
    } else {
      sourceEl.textContent = r.source;
    }
  } else {
    sourceSection.style.display = 'none';
  }

  // Steps
  const stepsSection = document.getElementById('stepsSection');
  const stepsEl = document.getElementById('detailSteps');
  if (r.steps && r.steps.length > 0) {
    stepsSection.style.display = 'block';
    stepsEl.innerHTML = r.steps.map((s, i) => `
      <div class="step-item">
        <div class="step-item-num">${i + 1}</div>
        <div class="step-item-text">${escapeHtml(s)}</div>
      </div>
    `).join('');
  } else {
    stepsSection.style.display = 'block';
    stepsEl.innerHTML = '<div style="color:var(--text-secondary);font-size:14px;">还没有步骤，快去添加吧</div>';
  }

  // Pits
  const pitsEl = document.getElementById('detailPits');
  if (r.pits && r.pits.length > 0) {
    pitsEl.innerHTML = r.pits.map(p => `<div class="pits-item">${escapeHtml(p)}</div>`).join('');
  } else {
    pitsEl.innerHTML = '<div class="no-pits">还没有记录踩坑</div>';
  }

  // Reflections
  const reflectionsEl = document.getElementById('detailReflections');
  if (r.reflections && r.reflections.length > 0) {
    reflectionsEl.innerHTML = [...r.reflections].reverse().map(ref => `
      <div class="reflection-item">
        <div class="reflection-date">${new Date(ref.date).toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric'})}</div>
        ${escapeHtml(ref.text)}
      </div>
    `).join('');
  } else {
    reflectionsEl.innerHTML = '<div class="no-reflections">还没有反思记录</div>';
  }

  document.getElementById('newReflection').value = '';
  document.getElementById('newPit').value = '';

  window.scrollTo(0, 0);
}

function showList() {
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('listView').classList.remove('hidden');
  currentId = null;
}

function toggleReflectionForm(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function addReflection() {
  const text = document.getElementById('newReflection').value.trim();
  const pit = document.getElementById('newPit').value.trim();

  if (!text && !pit) {
    toast('至少填写一项');
    return;
  }

  const r = recipes.find(x => x.id === currentId);
  if (!r) return;

  if (text) {
    if (!r.reflections) r.reflections = [];
    r.reflections.push({ text, date: new Date().toISOString() });
  }
  if (pit) {
    if (!r.pits) r.pits = [];
    const pits = pit.split('\n').filter(Boolean);
    r.pits = [...new Set([...r.pits, ...pits])];
  }

  r.updatedAt = new Date().toISOString();
  saveToStorage();
  showDetail(currentId);
  toast('记录已保存 ✓');
}

function deleteRecipe() {
  if (!confirm(`确定删除「${recipes.find(x => x.id === currentId)?.name}」吗？`)) return;
  recipes = recipes.filter(x => x.id !== currentId);
  saveToStorage();
  showList();
  renderCategoryTabs();
  toast('已删除');
}

// ─── Add / Edit ──────────────────────────────────────────────────────────────
let stepFields = [];

function showAddModal(editId) {
  editingId = editId || null;
  document.getElementById('addModal').classList.add('active');
  document.getElementById('modalTitle').textContent = editingId ? '编辑菜谱' : '添加菜谱';
  document.getElementById('saveBtn').textContent = editingId ? '更新菜谱' : '保存菜谱';

  if (editingId) {
    const r = recipes.find(x => x.id === editingId);
    if (r) {
      document.getElementById('recipeName').value = r.name;
      document.getElementById('recipeCategory').value = r.category || '';
      document.getElementById('recipeSource').value = r.source || '';
      document.getElementById('recipePits').value = (r.pits || []).join('\n');
      renderStepFields(r.steps || []);
    }
  } else {
    document.getElementById('recipeName').value = '';
    document.getElementById('recipeCategory').value = '';
    document.getElementById('recipeSource').value = '';
    document.getElementById('recipePits').value = '';
    renderStepFields([]);
  }
}

function showDataModal() {
  document.getElementById('dataModal').classList.add('active');
  document.getElementById('dataCount').textContent = recipes.length;
  const updated = recipes.map(r => new Date(r.updatedAt || r.createdAt));
  const latest = updated.length ? new Date(Math.max(...updated)) : null;
  document.getElementById('dataDate').textContent = latest ? latest.toLocaleDateString('zh-CN') : '—';
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('active');
  editingId = null;
}

function closeDataModal() {
  document.getElementById('dataModal').classList.remove('active');
}

function renderStepFields(steps) {
  const container = document.getElementById('stepsEditor');
  stepFields = steps.map(s => s);
  container.innerHTML = steps.map((s, i) => stepFieldHtml(i, s)).join('');
  if (steps.length === 0) addStepField();
}

function stepFieldHtml(index, value) {
  return `
    <div class="step-row" id="step-row-${index}">
      <div class="step-num">${index + 1}</div>
      <textarea rows="2" data-step="${index}" placeholder="这一步做了什么…">${escapeHtml(value)}</textarea>
      <button class="step-del" onclick="removeStep(${index})">×</button>
    </div>
  `;
}

function addStepField() {
  stepFields.push('');
  const container = document.getElementById('stepsEditor');
  const i = stepFields.length - 1;
  container.insertAdjacentHTML('beforeend', stepFieldHtml(i, ''));
  container.lastElementChild.querySelector('textarea').focus();
}

function removeStep(index) {
  stepFields.splice(index, 1);
  const container = document.getElementById('stepsEditor');
  const rows = container.querySelectorAll('.step-row');
  container.innerHTML = '';
  stepFields.forEach((s, i) => {
    container.insertAdjacentHTML('beforeend', stepFieldHtml(i, s));
  });
  if (stepFields.length === 0) addStepField();
}

function saveRecipe() {
  const name = document.getElementById('recipeName').value.trim();
  if (!name) { toast('请填写菜名'); return; }

  // collect steps from DOM
  const stepEls = document.querySelectorAll('#stepsEditor textarea');
  const steps = Array.from(stepEls).map(el => el.value.trim()).filter(Boolean);

  const pits = document.getElementById('recipePits').value
    .split('\n').map(p => p.trim()).filter(Boolean);

  if (editingId) {
    const r = recipes.find(x => x.id === editingId);
    if (r) {
      r.name = name;
      r.category = document.getElementById('recipeCategory').value;
      r.source = document.getElementById('recipeSource').value.trim();
      r.steps = steps;
      r.pits = pits;
      r.updatedAt = new Date().toISOString();
    }
  } else {
    const id = 'r_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    recipes.push({
      id,
      name,
      category: document.getElementById('recipeCategory').value,
      source: document.getElementById('recipeSource').value.trim(),
      steps,
      pits,
      reflections: [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    });
  }

  saveToStorage();
  closeAddModal();
  renderList();
  renderCategoryTabs();
  toast(editingId ? '已更新 ✓' : '已保存 ✓');
}

// ─── Export / Import ─────────────────────────────────────────────────────────
function exportData() {
  if (recipes.length === 0) { toast('没有数据可导出'); return; }
  const blob = new Blob([JSON.stringify(recipes, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `做饭助手_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出 ✓');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('格式错误');
      recipes = data;
      saveToStorage();
      renderList();
      renderCategoryTabs();
      closeDataModal();
      toast(`已导入 ${data.length} 条菜谱 ✓`);
    } catch {
      toast('导入失败：文件格式不对');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ─── Utilities ───────────────────────────────────────────────────────────────
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ─── Go ──────────────────────────────────────────────────────────────────────
init();
</script>
</body>
